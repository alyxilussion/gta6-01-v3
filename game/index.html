<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FROSTLINE — a snowy neon open-world crime game</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #070b16; }
  #game { display: block; width: 100vw; height: 100vh; image-rendering: auto; cursor: crosshair; }
  #fallback { position: fixed; inset: 0; display: none; place-items: center; color: #cfe6ff;
    font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 24px; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800"></canvas>
<div id="fallback">FROSTLINE needs JavaScript and a desktop browser to play.</div>
<script src="src/config.js"></script>
<script src="src/world.js"></script>
<script src="src/entities.js"></script>
<script src="src/missions.js"></script>
<script src="src/audio.js"></script>
<script src="src/input.js"></script>
<script src="src/render.js"></script>
<script src="src/main.js"></script>
</body>
</html>
